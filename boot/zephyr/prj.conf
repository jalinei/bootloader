CONFIG_MBEDTLS=y 
CONFIG_PM=n

CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SIGNATURE_TYPE_RSA=y  # or another supported option

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

### mbedTLS has its own heap
# CONFIG_HEAP_MEM_POOL_SIZE is not set

CONFIG_FLASH=y

### Various Zephyr boards enable features that we don't want.
# CONFIG_BT is not set
# CONFIG_BT_CTLR is not set
# CONFIG_I2C is not set

CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n # former CONFIG_MODE_MINIMAL
### Ensure Zephyr logging changes don't use more resources
CONFIG_LOG_DEFAULT_LEVEL=0
### Use info log level by default
CONFIG_MCUBOOT_LOG_LEVEL_INF=n
### Decrease footprint by ~4 KB in comparison to CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_NANO=y
### Use picolibc to reduce flash usage
CONFIG_PICOLIBC=y


### Owntech-specific configuration

#
# General configuration
CONFIG_IS_BOOTLOADER=y
# CONFIG_BOOTLOADER_SRAM_SIZE=127
CONFIG_MCUBOOT_INDICATION_LED=y

#
# Recovery console
CONFIG_MCUBOOT_SERIAL=y

CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

#
# Mcumgr
CONFIG_MCUMGR=y

CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG_ALLOW_ERASE_PENDING=y

#
# Mcumgr dependencies
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y

#
# USB configuration
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="OwnTech"

#
# Enable retained memory
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

#
# Reduce boot time
CONFIG_BOOT_VALIDATE_SLOT0=n

#
# Reduce image size
CONFIG_UART_USE_RUNTIME_CONFIGURE=n
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_MCUMGR_GRP_OS_ECHO=n
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_IMAGE_SECONDARY=n
CONFIG_CBPRINTF_LIBC_SUBSTS=n
CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
CONFIG_STDOUT_CONSOLE=n
CONFIG_TIMEOUT_64BIT=n
### Disable malloc arena because we don't need it
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
